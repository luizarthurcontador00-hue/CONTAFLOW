# Configuracao do instalador (usada na Fase 8).
# Gera um instalador .exe para Windows que nao exige Node.js instalado.
#
# Como gerar (no Windows, ou em CI Windows):
#   npm install
#   npm run dist
# O electron-builder empacota o Electron + Node + dependencias e reconstroi
# automaticamente o modulo nativo (better-sqlite3) para a ABI do Electron.

appId: com.contaflow.gestorvendas
productName: Gestor de Vendas
copyright: Gestor de Vendas

# Publicacao no GitHub Releases (usada pelo auto-update / electron-updater).
# Gera o latest.yml necessario para o app detectar novas versoes.
publish:
  provider: github
  owner: luizarthurcontador00-hue
  repo: CONTAFLOW
  releaseType: release

directories:
  output: dist
  buildResources: build

# Inclui todo o projeto EXCETO o que nao deve ir para o instalador.
# (node_modules de producao sao incluidos automaticamente; nao restringir aqui
#  para nao excluir express/better-sqlite3.)
files:
  - "**/*"
  - "!_legado/**"
  - "!data/**"
  - "!dist/**"
  - "!**/*.md"
  - "!.git*"
  - "!**/*.map"

# better-sqlite3 possui codigo nativo (.node): precisa ficar fora do asar.
# puppeteer-cache/ tem o Chromium usado pelo whatsapp-web.js (atendimento);
# node_modules/whatsapp-web.js e puppeteer tambem precisam ficar fora do asar
# para conseguirem executar o binario do Chromium normalmente.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "puppeteer-cache/**"
  - "**/node_modules/whatsapp-web.js/**"
  - "**/node_modules/puppeteer/**"
  - "**/node_modules/puppeteer-core/**"

win:
  target:
    - nsis
  # Adicione um icone antes de gerar o instalador final:
  # icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gestor de Vendas
