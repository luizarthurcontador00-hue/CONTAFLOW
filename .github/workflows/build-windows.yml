name: Gerar instalador Windows

# Executa ao enviar codigo para a branch de desenvolvimento e tambem
# manualmente pelo botao "Run workflow" na aba Actions.
on:
  push:
    branches:
      - claude/sales-management-desktop-qwo9d4
  workflow_dispatch:

# Permissao para publicar o instalador em Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Remover chrome-headless-shell (nao usado, reduz o instalador)
        # O whatsapp-web.js roda em modo headless completo (nao "shell"), entao
        # esse binario extra baixado pelo Puppeteer nao e necessario.
        run: |
          node -e "require('fs').rmSync('puppeteer-cache/chrome-headless-shell', { recursive: true, force: true })"

      - name: Gerar e publicar o instalador (.exe) no GitHub Releases
        # electron-builder reconstroi o better-sqlite3 para o Electron, empacota
        # o app e publica no Releases (tag v<versao>) com o latest.yml necessario
        # para a atualizacao automatica funcionar.
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir as notas da versao no Release (aparecem no aviso de atualizacao do app)
        # Usa a mensagem do commit (sem a linha de coautoria) como "o que mudou
        # nesta versao" -- o electron-updater le isso em info.releaseNotes.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES=$(git log -1 --pretty=%B | sed '/Co-Authored-By:/,$d')
          gh release edit "v$VERSION" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar o instalador como artefato (download rapido)
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-de-Vendas-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
