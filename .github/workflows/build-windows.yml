name: Gerar instalador Windows

# Executa ao enviar codigo para a branch de desenvolvimento e tambem
# manualmente pelo botao "Run workflow" na aba Actions.
on:
  push:
    branches:
      - claude/sales-management-desktop-qwo9d4
  workflow_dispatch:

# Permissao para publicar o instalador em Releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Gerar e publicar o instalador (.exe) no GitHub Releases
        # electron-builder reconstroi o better-sqlite3 para o Electron, empacota
        # o app e publica no Releases (tag v<versao>) com o latest.yml necessario
        # para a atualizacao automatica funcionar.
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar o instalador como artefato (download rapido)
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-de-Vendas-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
